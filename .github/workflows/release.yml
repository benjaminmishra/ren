name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust targets for Universal macOS binary
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Run Rust core tests
        working-directory: core
        run: cargo test

      - name: Build Universal Ren.app & Release Packages
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export APP_VERSION="$TAG_VERSION"
          fi
          UNIVERSAL=1 PACKAGE=1 ./build.sh
          ls -lh dist/

      - name: Run Swift tests
        working-directory: app
        run: swift test

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES_FILE="$(mktemp)"

          # Extract matching section from CHANGELOG.md (fallback to auto-generated notes)
          awk -v ver="## ${TAG}" '
            index($0, ver) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              "dist/Ren-${TAG}-macos-universal.dmg" \
              "dist/Ren-${TAG}-macos-universal.zip" \
              "dist/Ren-${TAG}-macos-universal.sha256" \
              --title "Ren ${TAG}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              "dist/Ren-${TAG}-macos-universal.dmg" \
              "dist/Ren-${TAG}-macos-universal.zip" \
              "dist/Ren-${TAG}-macos-universal.sha256" \
              --title "Ren ${TAG}" \
              --generate-notes
          fi

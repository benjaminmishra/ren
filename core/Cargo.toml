[package]
name = "cleaner_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "cleaner_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jwalk = "0.8"
dirs = "5.0"
trash = "5.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
